name: Bug report
description: Report reproducible software behavior using synthetic data only.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real clinical data, credentials, `.env`, databases, logs with identifiers, or security exploit details.
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: Commit SHA or branch
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Patient intake
        - Authentication or roles
        - Triage workspace
        - Physician workspace
        - Ollama or Gemma
        - Voice or Vosk
        - RAG or evidence
        - Database or migration
        - Windows launcher
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use only public demo accounts and synthetic values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized test evidence
      description: Include commands and exit codes, but remove local paths and sensitive data.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I used only synthetic data and removed passwords, tokens, personal paths, databases, audio, and sensitive logs.
          required: true
        - label: This is not a private security vulnerability report.
          required: true
